name: One-time Jarvis Branch Cleanup
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cleanup-legacy-branch.yml'

permissions:
  contents: read

jobs:
  remove-obsolete-branch:
    if: github.repository == 'rightware-corporations/jarvis' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove only the exact unused temporary branch
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/wyzer-v031-core-import'
          expected='10aa4648b61b6e2d2c2b91b3ff3edd3fb68bfe9b'
          actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -z "$actual" ]]; then
            echo 'ALREADY_ABSENT'
            exit 0
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Branch diverged from original immutable SHA; deletion refused."
            exit 1
          fi
          git push origin --delete "$branch"
          remaining="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -n "$remaining" ]]; then
            echo "::error::Branch still present after attempted deletion."
            exit 1
          fi
          echo 'CLEANUP_PASS: obsolete branch deleted; main and develop remain.'
