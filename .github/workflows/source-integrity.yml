name: Jarvis Source Integrity
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all imported source hashes
        run: python scripts/verify_import.py
      - name: Compile imported Python and test modules
        run: python -m compileall -q wyzer tests scripts


  headless-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal headless test dependencies
        run: python -m pip install 'pydantic>=2.8,<3' 'pytest>=8,<9' 'psutil>=6,<8' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'uvicorn>=0.30,<1'
      - name: Run isolated headless contract tests
        run: python -m pytest -q tests_lab
